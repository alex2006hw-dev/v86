[package]
name = "v86"
version = "0.1.0"
publish = false
edition = "2021"

[dependencies]
# The permissively-licensed PC/XT/AT firmware. It is a separate crate so
# that it can be unit-tested on its own and built to wasm32-wasip1 for the
# standalone Node test harness; see src/rust/firmware/README.md.
v86-firmware = { path = "src/rust/firmware", default-features = false }

[features]
default = []
profiler = []

[lib]
crate-type = ["cdylib"]
path = "src/rust/lib.rs"

[profile.test]
lto = false
opt-level = 2
overflow-checks = false

[profile.dev]
lto = true
opt-level = 2
panic = "abort"
overflow-checks = false

[profile.release]
lto = true
opt-level = 3
incremental = false
panic = "abort"
