[package]
name = "v86-firmware"
version = "0.1.0"
edition = "2021"
description = "Permissively-licensed (MIT) PC/XT/AT BIOS firmware for the v86 emulator. PCjs-derived services plus modern features (INT 13h EDD/LBA, El Torito, VBE 2.0+) implemented from public specifications."
license = "MIT"

[lib]
path = "src/lib.rs"
# "lib" so the firmware can be unit-tested and embedded in the main v86
# crate; "cdylib" so Node.js can load it as a WASI module and drive it
# against the PCjs x86 CPU.
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"

[profile.test]
opt-level = 1